name: CI/CD Multi-Arch Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Define limited execution permissions for GITHUB_TOKEN
permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Native Image
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            platform-suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            platform-suffix: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set up Docker Buildx for advanced builder caching features
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Log in to GitHub Container Registry (GHCR) only when creating a release (tag push)
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the Docker image. If a tag is pushed, it pushes by digest directly to GHCR.
      # If not a tag, it performs a native dry-run compilation locally to verify correctness.
      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          outputs: ${{ startsWith(github.ref, 'refs/tags/v') && format('type=image,name=ghcr.io/{0},push-by-digest=true,name-canonical=true', github.repository) || '' }}
          # Use Actions cache backend for extremely fast subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Export the unique digest for manifest stitching on releases
      - name: Export Digest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      # Upload the digest file as an artifact
      - name: Upload Digest Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform-suffix }}
          path: /tmp/digests/*
          if-no-files-found: error

  merge:
    name: Merge Manifests & Publish Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      # Set up Docker Buildx to enable imagetools execution
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Download all exported digests from parallel build matrix jobs
      - name: Download Digest Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      # Log in to GitHub Container Registry to authorize the release manifest push
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Merge all digests into a unified multi-architecture manifest and tag it
      - name: Stitch Manifests & Publish Release
        run: |
          cd /tmp/digests
          docker buildx imagetools create \
            -t "ghcr.io/${{ github.repository }}:${{ github.ref_name }}" \
            -t "ghcr.io/${{ github.repository }}:latest" \
            $(printf "ghcr.io/${{ github.repository }}@sha256:%s " *)

