name: Lint

# Automated shell and Docker linter checks (AGENTS.md repository architecture).
# Path-filtered so docs/Go-only changes do not spin up lint runners; the
# workflow always includes itself so lint-definition changes are self-checked.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repository (AGENTS.md security rules)
permissions:
  contents: read

jobs:
  # Cheap gate job: detects whether shell scripts or Dockerfiles changed.
  changes:
    name: Detect Lint Changes
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      scripts: ${{ steps.filter.outputs.scripts }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          # Full history so paths-filter can diff against the previous push
          fetch-depth: 0

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            scripts:
              - 'src/**'
              - 'tests/**'
              - '.github/workflows/lint.yml'
            docker:
              - 'Dockerfile'
              - 'Dockerfile.supervisor'
              - '.dockerignore'
              - '.github/workflows/lint.yml'

  shellcheck:
    name: ShellCheck & Tests (src/*.sh)
    needs: changes
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || needs.changes.outputs.scripts == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      # shellcheck ships with the ubuntu runner image; identical to the local
      # mandated check `nix develop --command shellcheck src/*.sh` (AGENTS.md).
      - name: Run ShellCheck
        run: shellcheck src/*.sh

      - name: Run Script Unit Tests
        run: bash tests/unit/entrypoint_test.sh

  hadolint:
    name: Hadolint (${{ matrix.dockerfile }})
    needs: changes
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || needs.changes.outputs.docker == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile:
          - Dockerfile
          - Dockerfile.supervisor
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          # The runner image currently carries pre-existing style warnings
          # (DL3008 unpinned apt packages, DL4006 pipefail, DL3059 RUN
          # consolidation). They surface as PR annotations but do not fail CI
          # until the image-hardening pass pins them; error-severity findings
          # still fail the job.
          failure-threshold: error
